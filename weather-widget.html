<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; overflow:hidden; width:1920px; height:1080px; font-family:Arial,sans-serif; }

  .weather-widget {
    position:absolute; top:30px; left:50px;
    background:linear-gradient(135deg,rgba(20,40,80,0.88),rgba(10,20,50,0.90));
    border-radius:12px; padding:20px 26px;
    min-width:300px;
    border:1px solid rgba(100,160,255,0.2);
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
  }
  .location { font-size:13px; color:#88AADD; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
  .main-row { display:flex; align-items:center; gap:16px; }
  .weather-icon { font-size:54px; line-height:1; }
  .temp { font-size:58px; font-weight:800; color:#FFFFFF; line-height:1; }
  .unit { font-size:24px; color:#88AADD; vertical-align:super; }
  .condition { font-size:16px; color:#BBCCEE; margin-top:6px; font-weight:500; }
  .details { display:flex; gap:20px; margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.1); }
  .detail-item { display:flex; flex-direction:column; align-items:center; }
  .detail-label { font-size:10px; color:#667799; letter-spacing:1px; text-transform:uppercase; }
  .detail-val { font-size:15px; color:#CCE0FF; font-weight:700; margin-top:3px; }

  .forecast { display:flex; gap:12px; margin-top:14px; }
  .fc-day {
    flex:1; text-align:center;
    background:rgba(255,255,255,0.05); border-radius:8px; padding:8px 6px;
  }
  .fc-day-name { font-size:10px; color:#667799; text-transform:uppercase; letter-spacing:1px; }
  .fc-icon { font-size:22px; margin:4px 0; }
  .fc-temp { font-size:13px; color:#FFFFFF; font-weight:700; }
  .fc-low  { font-size:11px; color:#667799; }
</style>
</head>
<body>
<div class="weather-widget">
  <div class="location">📍 New York, NY</div>
  <div class="main-row">
    <div class="weather-icon">⛅</div>
    <div>
      <div class="temp">72<span class="unit">°F</span></div>
      <div class="condition">Partly Cloudy</div>
    </div>
  </div>
  <div class="details">
    <div class="detail-item"><div class="detail-label">Humidity</div><div class="detail-val">61%</div></div>
    <div class="detail-item"><div class="detail-label">Wind</div><div class="detail-val">12 mph</div></div>
    <div class="detail-item"><div class="detail-label">UV Index</div><div class="detail-val">6</div></div>
    <div class="detail-item"><div class="detail-label">Visibility</div><div class="detail-val">10 mi</div></div>
  </div>
  <div class="forecast">
    <div class="fc-day"><div class="fc-day-name">Mon</div><div class="fc-icon">🌤️</div><div class="fc-temp">74°</div><div class="fc-low">58°</div></div>
    <div class="fc-day"><div class="fc-day-name">Tue</div><div class="fc-icon">🌧️</div><div class="fc-temp">65°</div><div class="fc-low">52°</div></div>
    <div class="fc-day"><div class="fc-day-name">Wed</div><div class="fc-icon">⛈️</div><div class="fc-temp">60°</div><div class="fc-low">49°</div></div>
    <div class="fc-day"><div class="fc-day-name">Thu</div><div class="fc-icon">☀️</div><div class="fc-temp">78°</div><div class="fc-low">61°</div></div>
    <div class="fc-day"><div class="fc-day-name">Fri</div><div class="fc-icon">🌤️</div><div class="fc-temp">76°</div><div class="fc-low">60°</div></div>
  </div>
</div>
</body>
</html>
