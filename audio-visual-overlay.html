<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Audio Visual Overlay</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:transparent;
    width:1920px; height:1080px;
    font-family:'Arial Black', Arial, sans-serif;
    overflow:hidden;
  }

  /* ── Click to Start Overlay ── */
  .start-screen {
    position:absolute; inset:0;
    display:flex; align-items:flex-end; justify-content:flex-start;
    padding:40px 50px;
    z-index:999;
  }
  .start-btn {
    background:linear-gradient(135deg,rgba(10,20,50,0.95),rgba(5,10,30,0.97));
    border:1px solid rgba(0,150,255,0.4);
    border-radius:14px; padding:14px 20px;
    width:300px; cursor:pointer;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 8px 32px rgba(0,0,0,0.6);
    transition:transform 0.2s, box-shadow 0.2s;
  }
  .start-btn:hover {
    transform:scale(1.03);
    box-shadow:0 12px 40px rgba(0,102,255,0.4);
  }
  .play-circle {
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(135deg,#0066FF,#00C6FF);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0;
    animation:pulse 1.5s ease infinite;
  }
  @keyframes pulse {
    0%,100%{ box-shadow:0 0 0 0 rgba(0,102,255,0.5); }
    50%    { box-shadow:0 0 0 10px rgba(0,102,255,0); }
  }
  .start-text {}
  .start-title { font-size:14px; color:#FFFFFF; font-weight:900; }
  .start-sub   { font-size:11px; color:#8899BB; font-family:Arial,sans-serif; margin-top:2px; }

  /* ── Audio Widget ── */
  .audio-widget {
    position:absolute; bottom:40px; left:50px;
    width:300px;
    background:linear-gradient(135deg,rgba(10,20,50,0.92),rgba(5,10,30,0.94));
    border-radius:14px; padding:16px 18px;
    border:1px solid rgba(0,150,255,0.25);
    box-shadow:0 8px 32px rgba(0,0,0,0.5);
    display:none;
    animation:fadeIn 0.6s ease forwards;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  .header-row { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .music-icon { font-size:22px; animation:spin 4s linear infinite; display:inline-block; }
  @keyframes spin { to{ transform:rotate(360deg); } }
  .header-label { font-size:11px; color:#88AADD; letter-spacing:2px; text-transform:uppercase; font-family:Arial,sans-serif; }
  .live-badge {
    margin-left:auto; background:#CC0000; color:#fff;
    font-size:9px; font-weight:700; padding:2px 7px;
    border-radius:3px; letter-spacing:2px;
    display:flex; align-items:center; gap:4px; font-family:Arial,sans-serif;
  }
  .live-dot { width:6px; height:6px; background:#fff; border-radius:50%; animation:blink 1s infinite; }
  @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:0} }

  .track-title  { font-size:14px; color:#FFFFFF; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-artist { font-size:11px; color:#8899BB; letter-spacing:1px; margin-top:2px; font-family:Arial,sans-serif; font-weight:400; }

  .equalizer { display:flex; align-items:flex-end; gap:3px; height:28px; margin:10px 0; }
  .bar { width:6px; background:linear-gradient(180deg,#00C6FF,#0066FF); border-radius:2px 2px 0 0; animation:eq 0.5s ease infinite alternate; }
  .bar:nth-child(1){ height:10px; animation-delay:0.00s; }
  .bar:nth-child(2){ height:18px; animation-delay:0.10s; }
  .bar:nth-child(3){ height:26px; animation-delay:0.20s; }
  .bar:nth-child(4){ height:20px; animation-delay:0.05s; }
  .bar:nth-child(5){ height:28px; animation-delay:0.15s; }
  .bar:nth-child(6){ height:22px; animation-delay:0.25s; }
  .bar:nth-child(7){ height:24px; animation-delay:0.08s; }
  .bar:nth-child(8){ height:16px; animation-delay:0.18s; }
  .bar:nth-child(9){ height:20px; animation-delay:0.12s; }
  .bar:nth-child(10){height:14px; animation-delay:0.22s; }
  @keyframes eq { 0%{transform:scaleY(0.3);opacity:0.7} 100%{transform:scaleY(1);opacity:1} }

  .progress-bg { height:3px; background:rgba(255,255,255,0.08); border-radius:2px; margin:8px 0 4px; }
  .progress-fill { height:3px; background:linear-gradient(90deg,#0066FF,#00C6FF); border-radius:2px; width:0; transition:width 0.5s linear; }
  .time-row { display:flex; justify-content:space-between; font-size:10px; color:#445566; font-family:Arial,sans-serif; margin-bottom:10px; }

  .divider { height:1px; background:rgba(255,255,255,0.06); margin:8px 0; }

  .controls { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:10px; }
  .ctrl-btn { font-size:18px; cursor:pointer; color:#8899BB; transition:color 0.2s,transform 0.2s; user-select:none; }
  .ctrl-btn:hover { color:#fff; transform:scale(1.1); }
  .ctrl-btn.play { font-size:28px; color:#0099FF; }

  .volume-row { display:flex; align-items:center; gap:8px; }
  .vol-icon { font-size:13px; color:#445566; }
  .vol-slider {
    -webkit-appearance:none; flex:1; height:3px;
    background:linear-gradient(90deg,#0066FF 70%,rgba(255,255,255,0.1) 70%);
    border-radius:2px; outline:none; cursor:pointer;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance:none; width:11px; height:11px;
    background:#0099FF; border-radius:50%;
  }
</style>
</head>
<body>

  <!-- Click to Start Screen -->
  <div class="start-screen" id="start-screen">
    <div class="start-btn" onclick="startAudio()">
      <div class="play-circle">▶</div>
      <div class="start-text">
        <div class="start-title">🎵 Click to Start Audio</div>
        <div class="start-sub">Tap here to enable sound</div>
      </div>
    </div>
  </div>

  <!-- Audio Widget (hidden until click) -->
  <div class="audio-widget" id="audio-widget">
    <div class="header-row">
      <span class="music-icon">🎵</span>
      <span class="header-label">Now Playing</span>
      <div class="live-badge"><div class="live-dot"></div>LIVE</div>
    </div>

    <div class="track-title"  id="track-title">SoundHelix Song 1</div>
    <div class="track-artist" id="track-artist">SoundHelix</div>

    <div class="equalizer">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="progress-bg"><div class="progress-fill" id="prog"></div></div>
    <div class="time-row"><span id="cur-time">0:00</span><span id="dur-time">0:00</span></div>

    <div class="divider"></div>

    <div class="controls">
      <span class="ctrl-btn" onclick="prevTrack()">⏮</span>
      <span class="ctrl-btn play" id="play-btn" onclick="togglePlay()">⏸</span>
      <span class="ctrl-btn" onclick="nextTrack()">⏭</span>
    </div>

    <div class="volume-row">
      <span class="vol-icon">🔈</span>
      <input type="range" class="vol-slider" id="vol" min="0" max="100" value="70" oninput="setVolume(this.value)">
      <span class="vol-icon">🔊</span>
    </div>
  </div>

  <audio id="audio" crossorigin="anonymous"></audio>

<script>
const audio   = document.getElementById('audio');
const playBtn = document.getElementById('play-btn');
const tracks  = [
  { title:'SoundHelix Song 1', artist:'SoundHelix', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
  { title:'SoundHelix Song 2', artist:'SoundHelix', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
  { title:'SoundHelix Song 3', artist:'SoundHelix', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
];
let cur = 0;

// ── Unlock audio on first user click ──
function startAudio(){
  document.getElementById('start-screen').style.display  = 'none';
  document.getElementById('audio-widget').style.display  = 'block';
  loadTrack(cur);
}

function loadTrack(i){
  audio.src = tracks[i].url;
  document.getElementById('track-title').textContent  = tracks[i].title;
  document.getElementById('track-artist').textContent = tracks[i].artist;
  audio.play().catch(()=>{});
  playBtn.textContent = '⏸';
}

function togglePlay(){
  if(audio.paused){ audio.play(); playBtn.textContent='⏸'; }
  else            { audio.pause(); playBtn.textContent='▶️'; }
}
function nextTrack(){ cur=(cur+1)%tracks.length; loadTrack(cur); }
function prevTrack(){ cur=(cur-1+tracks.length)%tracks.length; loadTrack(cur); }

function setVolume(v){
  audio.volume = v/100;
  document.getElementById('vol').style.background =
    `linear-gradient(90deg,#0066FF ${v}%,rgba(255,255,255,0.1) ${v}%)`;
}

function fmt(s){
  if(!s||isNaN(s)) return '0:00';
  return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
}

audio.addEventListener('timeupdate',()=>{
  const c=audio.currentTime, d=audio.duration||0;
  document.getElementById('cur-time').textContent = fmt(c);
  document.getElementById('dur-time').textContent = fmt(d);
  document.getElementById('prog').style.width = (d ? c/d*100 : 0)+'%';
});
audio.addEventListener('ended', nextTrack);
setVolume(70);
</script>
</body>
</html>
