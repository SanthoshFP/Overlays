<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; overflow:hidden; width:1920px; height:1080px; font-family:'Courier New',monospace; }

  .clock-widget {
    position:absolute; top:30px; right:50px;
    background:rgba(0,0,0,0.75);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:8px; padding:14px 22px;
    text-align:right;
    backdrop-filter:blur(4px);
    box-shadow:0 4px 24px rgba(0,0,0,0.4);
  }
  .live-badge {
    display:inline-flex; align-items:center; gap:6px;
    background:#CC0000; border-radius:3px;
    padding:2px 10px; margin-bottom:8px;
    font-family:Arial,sans-serif; font-size:12px;
    font-weight:700; color:#fff; letter-spacing:2px; text-transform:uppercase;
  }
  .live-dot { width:7px; height:7px; background:#fff; border-radius:50%; animation:blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .time-display {
    font-size:46px; font-weight:700; color:#FFFFFF;
    letter-spacing:2px; line-height:1;
  }
  .colon { animation:blink 1s infinite; }
  .date-display {
    font-family:Arial,sans-serif; font-size:13px;
    color:#BBBBBB; letter-spacing:1.5px;
    text-transform:uppercase; margin-top:6px;
  }
  .timezone {
    font-family:Arial,sans-serif; font-size:11px;
    color:#666; margin-top:3px; letter-spacing:1px;
  }
</style>
</head>
<body>
<div class="clock-widget">
  <div class="live-badge"><div class="live-dot"></div>LIVE</div>
  <div class="time-display" id="time">00<span class="colon">:</span>00<span class="colon">:</span>00</div>
  <div class="date-display" id="date">Monday, January 01 2025</div>
  <div class="timezone" id="tz">UTC+00:00</div>
</div>

<script>
function pad(n){ return String(n).padStart(2,'0'); }
function update(){
  const now = new Date();
  document.getElementById('time').innerHTML =
    pad(now.getHours())+'<span class="colon">:</span>'+
    pad(now.getMinutes())+'<span class="colon">:</span>'+
    pad(now.getSeconds());
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('date').textContent =
    days[now.getDay()]+', '+months[now.getMonth()]+' '+pad(now.getDate())+' '+now.getFullYear();
  const offset = -now.getTimezoneOffset();
  const sign = offset>=0?'+':'-';
  const h = pad(Math.floor(Math.abs(offset)/60));
  const m = pad(Math.abs(offset)%60);
  document.getElementById('tz').textContent = 'UTC'+sign+h+':'+m;
}
update(); setInterval(update,1000);
</script>
</body>
</html>
