<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:transparent;
    width:1920px; height:1080px;
    overflow:hidden;
  }

  .video-widget {
    position:absolute; top:30px; right:50px;
    width:320px;
    border-radius:14px; overflow:hidden;
    border:1px solid rgba(0,150,255,0.25);
    box-shadow:0 8px 32px rgba(0,0,0,0.6);
    animation:fadeIn 0.5s ease forwards;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  video { width:100%; display:block; }

  /* Single unmute button */
  .unmute-btn {
    position:absolute; top:8px; right:8px;
    background:rgba(0,0,0,0.7);
    color:#fff; font-size:13px;
    padding:5px 10px; border-radius:20px;
    cursor:pointer; font-family:Arial,sans-serif;
    border:1px solid rgba(255,255,255,0.2);
    transition:background 0.2s;
    display:flex; align-items:center; gap:5px;
  }
  .unmute-btn:hover { background:rgba(0,102,255,0.8); }
  .unmute-btn.hidden { display:none; }
</style>
</head>
<body>

<div class="video-widget">
  <video id="vid" autoplay muted loop playsinline>
    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
  </video>
  <div class="unmute-btn" id="btn" onclick="unmute()">🔇 Tap for Audio</div>
</div>

<script>
function unmute(){
  const vid = document.getElementById('vid');
  vid.muted  = false;
  vid.volume = 1;
  document.getElementById('btn').classList.add('hidden');
}
</script>
</body>
</html>
