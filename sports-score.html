<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; overflow:hidden; width:1920px; height:1080px; font-family:'Arial Black',Arial,sans-serif; }

  .scoreboard {
    position:absolute; top:30px; left:50%;
    transform:translateX(-50%);
    display:flex; align-items:stretch;
    background:rgba(8,8,8,0.90);
    border-radius:6px; overflow:hidden;
    box-shadow:0 4px 30px rgba(0,0,0,0.5);
    min-width:540px;
  }
  .team {
    display:flex; align-items:center; gap:14px;
    padding:10px 20px; flex:1;
  }
  .team-logo {
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:900; color:#fff;
  }
  .team-name { font-size:17px; font-weight:900; color:#fff; letter-spacing:1px; text-transform:uppercase; }
  .team-city { font-size:11px; color:#888; font-weight:400; letter-spacing:1px; font-family:Arial,sans-serif; }

  .score-center {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8px 22px; background:rgba(255,255,255,0.05);
    border-left:1px solid rgba(255,255,255,0.08);
    border-right:1px solid rgba(255,255,255,0.08);
  }
  .score-row { display:flex; align-items:center; gap:10px; }
  .score-val { font-size:36px; font-weight:900; color:#FFFFFF; line-height:1; }
  .score-dash { font-size:22px; color:#555; font-weight:400; }
  .period-badge {
    background:#CC0000; color:#fff; border-radius:3px;
    font-size:11px; font-weight:700; padding:2px 8px;
    letter-spacing:2px; text-transform:uppercase;
    font-family:Arial,sans-serif; margin-top:5px;
    display:flex; align-items:center; gap:5px;
  }
  .live-dot { width:6px; height:6px; background:#fff; border-radius:50%; animation:blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .team-right { flex-direction:row-reverse; }
  .team-right .team-info { text-align:right; }
</style>
</head>
<body>
<div class="scoreboard">
  <div class="team">
    <div class="team-logo" style="background:#003087;">CHI</div>
    <div class="team-info">
      <div class="team-name">Chicago</div>
      <div class="team-city">Bulls</div>
    </div>
  </div>

  <div class="score-center">
    <div class="score-row">
      <div class="score-val" id="s1">87</div>
      <div class="score-dash">–</div>
      <div class="score-val" id="s2">91</div>
    </div>
    <div class="period-badge">
      <div class="live-dot"></div>
      <span id="period">Q3 · 4:22</span>
    </div>
  </div>

  <div class="team team-right">
    <div class="team-info" style="text-align:right">
      <div class="team-name">Miami</div>
      <div class="team-city">Heat</div>
    </div>
    <div class="team-logo" style="background:#98002E;">MIA</div>
  </div>
</div>
</body>
</html>
