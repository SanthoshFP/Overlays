<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; overflow:hidden; width:1920px; height:1080px; font-family:Arial,sans-serif; }

  .lower-third {
    position:absolute; bottom:120px; left:80px;
    animation:slideIn 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
    opacity:0;
  }
  @keyframes slideIn {
    0%   { transform:translateX(-80px); opacity:0; }
    100% { transform:translateX(0);     opacity:1; }
  }

  .accent-bar {
    width:5px; height:100%; background:#0066FF;
    position:absolute; left:0; top:0;
  }
  .name-block {
    background:rgba(10,10,10,0.88);
    padding:14px 24px 14px 20px;
    border-left:5px solid #0066FF;
    min-width:380px;
  }
  .name {
    font-size:26px; font-weight:800; color:#FFFFFF;
    letter-spacing:0.5px; line-height:1.2;
  }
  .title {
    font-size:15px; color:#AAAAAA; font-weight:400;
    margin-top:4px; letter-spacing:1px; text-transform:uppercase;
  }
  .bottom-line {
    height:3px; background:linear-gradient(90deg,#0066FF,#00C6FF);
    width:0; animation:expand 0.5s 0.5s ease forwards;
  }
  @keyframes expand { to { width:100%; } }
</style>
</head>
<body>
<div class="lower-third">
  <div class="name-block">
    <div class="name">Alexandra Reynolds</div>
    <div class="title">Senior Correspondent · Washington D.C.</div>
  </div>
  <div class="bottom-line"></div>
</div>
</body>
</html>
